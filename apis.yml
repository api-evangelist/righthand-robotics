aid: righthand-robotics
name: RightHand Robotics
description: 'RightHand Robotics builds autonomous piece-picking robotic systems for
  order fulfillment. Its RightPick platform combines computer vision, machine learning,
  and adaptive grasping hardware to pick and place millions of SKUs at cycle times
  as fast as three seconds across e-commerce, pharmaceutical, apparel, health & beauty,
  and grocery operations. The company was surfaced as a portfolio company of GV, Menlo
  Ventures, and SoftBank Vision Fund. RightHand Robotics does not publish a public
  web API; integration, deployment, and operator documentation is provided to authorized
  customers and partners through a login-gated partner portal (rhrdocs.com). The public
  GitHub organization hosts open-source ROS packages and C control libraries for the
  earlier ReFlex robotic hand hardware rather than web-API client SDKs.'
